name: myislam_flutter
description: "MyIslam - Complete Islamic companion mobile app built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  audioplayers: ^6.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  sensors_plus: ^7.1.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
